<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9-Ball Billiard</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #111; overflow: hidden; font-family: sans-serif; }
      #game-container { position: relative; width: 100vw; height: 100vh; }
      canvas { position: absolute; top: 0; left: 0; z-index: 0; }
      #ui-overlay {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none; z-index: 1;
      }
      #hud {
        position: absolute; top: 16px; left: 16px;
        color: #fff; font-size: 16px; text-shadow: 1px 1px 2px #000;
        line-height: 1.6;
      }
      #foul-notification {
        display: none;
        position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
        background: rgba(200,50,50,0.9); color: #fff;
        padding: 10px 20px; border-radius: 8px; font-size: 14px;
        text-align: center;
      }
      #game-over-screen {
        display: none;
        position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
        background: rgba(0,0,0,0.85); color: #fff;
        padding: 32px 48px; border-radius: 12px; text-align: center;
      }
      #game-over-screen h2 { font-size: 28px; margin-bottom: 16px; }
      #restart-btn {
        pointer-events: auto; cursor: pointer;
        padding: 10px 28px; font-size: 16px;
        background: #4a9; color: #fff; border: none; border-radius: 8px;
      }
      #restart-btn:hover { background: #3a8; }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-overlay">
        <div id="hud">
          <div id="turn-indicator">あなたのターン</div>
          <div id="target-ball">1番を狙え</div>
        </div>
        <div id="foul-notification"></div>
        <div id="game-over-screen">
          <h2 id="result-message"></h2>
          <button id="restart-btn">もう一度</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
