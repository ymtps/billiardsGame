<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ビリヤード</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #111; overflow: hidden; font-family: sans-serif; }
      #game-container { position: relative; width: 100vw; height: 100vh; }
      canvas { position: absolute; top: 0; left: 0; z-index: 0; }
      #ui-overlay {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none; z-index: 1;
      }
      #hud {
        position: absolute; top: 16px; left: 16px;
        color: #fff; font-size: 16px; text-shadow: 1px 1px 2px #000;
        line-height: 1.6;
      }
      #turn-notification {
        display: none;
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(30,100,200,0.88); color: #fff;
        padding: 14px 36px; border-radius: 10px; font-size: 22px; font-weight: bold;
        text-align: center; pointer-events: none;
        letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      }
      #foul-notification {
        display: none;
        position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
        background: rgba(200,50,50,0.9); color: #fff;
        padding: 10px 20px; border-radius: 8px; font-size: 14px;
        text-align: center;
      }
      #game-over-screen {
        display: none;
        position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
        background: rgba(0,0,0,0.85); color: #fff;
        padding: 32px 48px; border-radius: 12px; text-align: center;
      }
      #game-over-screen h2 { font-size: 28px; margin-bottom: 16px; }
      #restart-btn {
        pointer-events: auto; cursor: pointer;
        padding: 10px 28px; font-size: 16px;
        background: #4a9; color: #fff; border: none; border-radius: 8px;
      }
      #restart-btn:hover { background: #3a8; }
      #sound-btn {
        pointer-events: auto; cursor: pointer;
        position: absolute; top: 16px; right: 16px;
        background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25);
        color: #fff; font-size: 18px; width: 38px; height: 38px;
        border-radius: 8px; display: flex; align-items: center; justify-content: center;
      }
      #sound-btn:hover { background: rgba(255,255,255,0.15); }

      /* Shot mode UI */
      #power-meter {
        display: none;
        position: absolute; bottom: 40px; left: 50%;
        transform: translateX(-50%);
        width: 260px; text-align: center; pointer-events: none;
      }
      #power-label {
        color: rgba(255,255,255,0.75); font-size: 10px;
        letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase;
      }
      #power-track {
        background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 5px; height: 10px; overflow: hidden;
      }
      #power-fill {
        height: 100%; width: 0%; border-radius: 5px;
        background: linear-gradient(to right, #00e676, #ffeb3b, #f44336);
      }
      #shot-hint {
        display: none;
        position: absolute; bottom: 36px; left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.6); font-size: 12px;
        pointer-events: none; white-space: nowrap;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      }
      #aim-hint {
        display: none;
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, 130px);
        color: rgba(255,255,100,0.85); font-size: 12px;
        pointer-events: none; letter-spacing: 0.5px;
        text-shadow: 0 1px 4px rgba(0,0,0,0.9); text-align: center;
      }

      /* Start screen */
      #start-screen {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.92);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 10; pointer-events: auto;
      }
      #start-screen h1 {
        color: #fff; font-size: 36px; margin-bottom: 40px;
        letter-spacing: 3px; font-weight: bold;
      }
      .mode-card {
        width: 340px; margin: 10px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 12px; padding: 24px 32px;
        cursor: pointer; color: #fff; text-align: center;
        transition: background 0.15s, border-color 0.15s;
        font-family: sans-serif;
      }
      .mode-card:hover {
        background: rgba(255,255,255,0.14);
        border-color: rgba(255,255,255,0.4);
      }
      .mode-card h2 { font-size: 22px; margin-bottom: 8px; }
      .mode-card p { font-size: 13px; color: rgba(255,255,255,0.55); margin: 0; }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-overlay">
        <div id="hud">
          <div id="turn-indicator">あなたのターン</div>
          <div id="target-ball">1番を狙え</div>
          <div id="score-display" style="display:none;"></div>
        </div>
        <button id="sound-btn" title="サウンド ON/OFF">🔊</button>
        <div id="turn-notification"></div>
        <div id="foul-notification"></div>
        <div id="power-meter">
          <div id="power-label">POWER</div>
          <div id="power-track"><div id="power-fill"></div></div>
        </div>
        <div id="shot-hint">右クリックドラッグ：カメラ回転 ｜ 左クリック：ショットモードへ</div>
        <div id="aim-hint">ドラッグで方向・強さを設定 → 離すとショット<br><span style="font-size:10px;opacity:0.7;">Esc / 右クリックでキャンセル</span></div>
        <div id="game-over-screen">
          <h2 id="result-message"></h2>
          <button id="restart-btn">もう一度</button>
        </div>
      </div>
      <div id="start-screen">
        <h1>3D ビリヤード</h1>
        <button id="btn-nine-ball" class="mode-card">
          <h2>9ボール</h2>
          <p>最初に9番を落とした方が勝ち</p>
        </button>
        <button id="btn-basic" class="mode-card">
          <h2>ベーシックゲーム</h2>
          <p>15球を多く落とした方が勝ち</p>
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
